<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category Answers</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f0f0ec; --border: #deded8;
    --text: #1d1d1b; --muted: #6b6b66; --accent: #1f6feb; --accent-soft: #e6efff;
    --good: #1a7f37; --good-soft: #dafbe1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151614; --surface: #1d1e1c; --surface-2: #262724; --border: #363733;
      --text: #ecece8; --muted: #9c9c96; --accent: #6ea8ff; --accent-soft: #1b2a44;
      --good: #3fb950; --good-soft: #12261a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; flex: 1; min-width: 220px; }
  .progress { font-variant-numeric: tabular-nums; color: var(--muted); }
  select, input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
  a { color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
  .help { color: var(--muted); font-size: 13px; }
  .card { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 88px 1fr; gap: 12px; }
  .card.done { border-color: var(--good); }
  .card img { width: 88px; height: 88px; object-fit: contain; border-radius: 8px; background: #fff; border: 1px solid var(--border); }
  .title { font-weight: 650; }
  .type { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-left: 6px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 18px; padding: 6px 12px; font: inherit; cursor: pointer; text-align: left; }
  .chip small { color: var(--muted); margin-left: 4px; }
  .chip[aria-pressed="true"] { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 650; }
  .chip:focus-visible, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .other { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
  .other input { min-width: 260px; flex: 1; }
  .chosen { font-size: 12.5px; color: var(--good); margin-top: 6px; }
  @media (max-width: 520px) { .card { grid-template-columns: 1fr; } .card img { width: 64px; height: 64px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Category answers · 200 products (stage 05)</h1>
    <span class="progress" id="progress"></span>
    <select id="filter" aria-label="Show">
      <option value="todo">Not answered yet</option>
      <option value="all">All</option>
      <option value="done">Answered</option>
      <option value="claude">Answered by Claude</option>
      <option value="unsure">Claude was unsure</option>
      <option value="mine">Answered by me</option>
    </select>
    <a href="/category-results">Model results →</a>
    <a href="/category-test">Live tester →</a>
    <a href="/">← Food browser</a>
  </div>
</header>
<main>
  <p class="help">Pick the right category for each product. The buttons are suggestions from the models (in neutral order, not ranked). If none is right, type in the box to search all categories. Answers save as you click.</p>
  <div id="list"></div>
  <datalist id="allcats"></datalist>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function el(tag, attrs, ...kids) {  // product data is untrusted: text only, never innerHTML
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k instanceof Node ? k : String(k));
  return n;
}
let data = null, byCode = {};
const label = (c) => byCode[c] ? `${c} ${byCode[c].name}` : c;

async function answer(id, code) {
  const res = await fetch("/api/category-review/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, code }) });
  const out = await res.json();
  if (out.error) { alert(out.error); return false; }
  if (code) data.answers[id] = code; else delete data.answers[id];
  return true;
}

function card(p) {
  const chosen = data.answers[p.id] || null;
  const c = el("article", { class: "card" + (chosen ? " done" : ""), id: "p-" + p.id });
  const img = el("img", { src: p.thumb && /^https:\/\//.test(p.thumb) ? p.thumb : "/no-image.svg", alt: "", loading: "lazy" });
  img.addEventListener("error", () => { img.src = "/no-image.svg"; });
  const nutr = p.nutr || {};
  const facts = [nutr.carbohydrates != null ? `carbs ${nutr.carbohydrates} g` : null, nutr.total_sugars != null ? `sugars ${nutr.total_sugars} g` : null,
                 nutr.total_fat != null ? `fat ${nutr.total_fat} g` : null].filter(Boolean).join(" · ");
  const body = el("div", null,
    el("div", null, el("span", { class: "title", text: p.name }), el("span", { class: "type", text: p.type })),
    el("div", { class: "meta", text: p.description || "" }),
    p.ingredients ? el("div", { class: "meta", text: "Ingredients: " + p.ingredients }) : null,
    facts ? el("div", { class: "meta", text: "Per 100 g: " + facts }) : null);
  const chips = el("div", { class: "chips" });
  const codes = [...p.candidates];
  if (chosen && !codes.includes(chosen)) codes.push(chosen);
  for (const code of codes) {
    const b = el("button", { class: "chip", "aria-pressed": String(chosen === code), title: byCode[code] ? byCode[code].definition : "" },
      code, el("small", { text: byCode[code] ? byCode[code].name : "" }));
    b.addEventListener("click", async () => { if (await answer(p.id, chosen === code ? null : code)) { if (data.claude) delete data.claude[p.id]; refresh(p.id); } });
    chips.append(b);
  }
  const input = el("input", { list: "allcats", placeholder: "None of these? Search all categories…", "aria-label": "Search all categories" });
  input.addEventListener("change", async () => {
    const code = input.value.split(" ")[0];
    if (byCode[code] && await answer(p.id, code)) { if (data.claude) delete data.claude[p.id]; refresh(p.id); }
  });
  body.append(chips, el("div", { class: "other" }, input));
  if (chosen) {
    const byClaude = data.claude && p.id in data.claude;
    body.append(el("div", { class: "chosen", text: "✓ " + label(chosen) + (byClaude ? "  · set by Claude, click another to change" : "  · your answer") }));
    if (byClaude && data.claude[p.id]) body.append(el("div", { class: "meta", text: "Claude was unsure: " + data.claude[p.id] }));
  }
  c.append(img, body);
  return c;
}

function refresh(id) {
  const old = $("p-" + id);
  const p = data.sample.find((x) => x.id === id);
  old.replaceWith(card(p));
  progress();
}
function progress() {
  const n = Object.keys(data.answers).length;
  const c = Object.keys(data.claude || {}).length;
  $("progress").textContent = `${n} / ${data.sample.length} answered (${n - c} you · ${c} Claude)`;
}
function render() {
  const f = $("filter").value;
  const cl = data.claude || {};
  const items = data.sample.filter((p) => f === "all" ? true : f === "done" ? data.answers[p.id]
    : f === "claude" ? p.id in cl : f === "unsure" ? cl[p.id] : f === "mine" ? data.answers[p.id] && !(p.id in cl) : !data.answers[p.id]);
  $("list").replaceChildren(...items.map(card));
  progress();
}
$("filter").addEventListener("change", render);
(async () => {
  data = await (await fetch("/api/category-review")).json();
  if (data.error) { $("list").textContent = data.error; return; }
  for (const c of data.categories) byCode[c.code] = c;
  $("allcats").replaceChildren(...data.categories.map((c) => el("option", { value: `${c.code} ${c.name}` }, `${c.group}`)));
  render();
})();
</script>
</body>
</html>
